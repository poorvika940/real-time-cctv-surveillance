<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Select Camera</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="p-4">
    <div class="container">
      <h3>Select Camera</h3>
      <p>If no camera is selected, choose "Laptop Dashcam or webcam"</p>
      <form method="get" action="/stream">
        <div class="mb-3">
          <label class="form-label">Camera</label>
          <select name="camera" class="form-select">
            {% for c in cameras %}
            <option value="{{ c }}">Camera {{ c }}</option>
            {% endfor %}
            <option value="0" selected>Laptop Dashcam / Webcam (default)</option>
          </select>
        </div>
        <div class="d-grid">
          <button class="btn btn-primary">Open Stream</button>
        </div>
      </form>
    </div>
  </body>
</html>
